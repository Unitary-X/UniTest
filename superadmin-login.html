<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin Login - Unitest Portal</title>
    <meta name="description" content="Secure super admin login for Unitest Portal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="superadmin-login.css?v=20260416a" />
</head>

<body>
    <div class="bg-wrap" aria-hidden="true">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
    </div>

    <main class="shell">
        <section class="card" aria-label="Super Admin Login">
            <div class="logo">🛡️</div>
            <h1>Super Admin</h1>
            <p class="sub">Unitest control access</p>

            <form id="superAdminForm" novalidate>
                <label class="label" for="saEmail">Username or Email</label>
                <input id="saEmail" type="text" autocomplete="username" placeholder="unitaryx" required />

                <label class="label" for="saPassword">Password</label>
                <div class="pw-wrap">
                    <input id="saPassword" type="password" autocomplete="current-password" placeholder="Enter password"
                        required />
                    <button type="button" id="togglePw" class="ghost" aria-label="Toggle password">👁</button>
                </div>

                <p class="err" id="saErr"></p>

                <button type="submit" class="btn" id="saBtn">
                    <span class="btn-text">Login as Super Admin</span>
                    <span class="btn-loader" hidden>Authenticating...</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <button type="button" id="toggleRecoverBtn" style="background:none; border:none; color:var(--muted); font-size: 0.85rem; cursor:pointer; text-decoration: underline;">Forgot Password?</button>
            </div>

            <section class="recover" id="recoverSection" aria-label="Recover Super Admin Password" style="display: none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <div class="recover-title" style="font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 15px;">Reset Super Admin Password</div>

                <form id="recoverForm" class="recover-panel" novalidate aria-live="polite">
                    <p class="recover-help">Use your server RESYNC_TOKEN to reset the super admin password.</p>

                    <label class="label" for="recoverToken">Resync Token</label>
                    <input id="recoverToken" type="password" placeholder="Enter RESYNC_TOKEN" autocomplete="off" required />

                    <label class="label" for="recoverEmail">Super Admin Username/Email</label>
                    <input id="recoverEmail" type="text" placeholder="e.g. unitaryx" required />

                    <label class="label" for="recoverNewPassword">New Password</label>
                    <input id="recoverNewPassword" type="password" placeholder="Min 6 characters" required />

                    <label class="label" for="recoverConfirmPassword">Confirm New Password</label>
                    <input id="recoverConfirmPassword" type="password" placeholder="Re-enter new password" required />

                    <p class="err" id="recoverErr"></p>

                    <button type="submit" class="btn recover-btn" id="recoverBtn">
                        <span class="btn-text">Reset Super Admin Password</span>
                        <span class="btn-loader" hidden>Resetting...</span>
                    </button>
                </form>
            </section>

            <div class="links">
                <a href="login.html">Back to Main Login</a>
            </div>
        </section>

        <footer class="credit">
            <span class="prefix">Designed and Powered by</span>
            <span class="team">Team Unitary X</span>
        </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="superadmin-login.js?v=20260416a"></script>
</body>

</html>
